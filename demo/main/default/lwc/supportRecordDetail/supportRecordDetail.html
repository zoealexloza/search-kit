<template>
  <template lwc:if={hasLayout}>
    <lightning-record-view-form
      record-id={recordId}
      object-api-name={objectApiName}
    >
      <article class="record-detail">
        <template lwc:if={title}>
          <h1 class="slds-text-heading_large slds-m-bottom_medium">{title}</h1>
        </template>
        <template for:each={detailFields} for:item="field">
          <lightning-output-field
            key={field}
            field-name={field}
          ></lightning-output-field>
        </template>
      </article>
    </lightning-record-view-form>
  </template>
</template>
